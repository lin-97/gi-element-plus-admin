name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend/web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec vite build
        env:
          NODE_ENV: production
          VITE_APP_TITLE: GI Element Plus Admin
          VITE_BASE: /gi-element-plus-admin/
          # 勿用仓库 Variables 覆盖为旧 HTTP 地址，否则 GitHub Pages(HTTPS) 会 Mixed Content 拦截
          VITE_API_BASE_URL: https://aizhongyi.abrdns.com/api/v1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
