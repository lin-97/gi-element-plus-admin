services:
  mysql:
    image: mysql:8.0
    container_name: gi-admin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gi-admin-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: gi-admin-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${API_PORT:-29891}:8000'
    environment:
      ENVIRONMENT: prod
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_TYPE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_ENABLE: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB_NAME: 1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-["https://lin-97.github.io"]}
    volumes:
      - api_logs:/app/logs
      - api_upload:/app/static/upload

volumes:
  mysql_data:
  redis_data:
  api_logs:
  api_upload:
